<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ありし日の急なクルクル寿司｜裕子さんのぽんこちゅ日記</title><meta name="description" content="2025年6月22日、港南台の回転寿司にて。裕子さんの突然のクルクル寿司日記。"><link rel="stylesheet" href="style.css"><style>body{background:#fffaf5}main{max-width:900px;margin:auto;padding:28px 20px 80px}.hero{text-align:center;padding:48px 10px}.hero h1{font-size:clamp(2rem,6vw,3.7rem);line-height:1.4}.date{color:#946a53;letter-spacing:.12em}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin:30px 0}.photos figure{margin:0}.photos img{width:100%;height:auto;border-radius:18px;box-shadow:0 8px 26px #0001}.photos figcaption{padding:10px;color:#806c5b}.story{padding:30px;background:#fff0df;border-radius:22px;line-height:2;font-size:1.08rem}.back{display:inline-block;padding:12px 18px;border:1px solid #bca38c;border-radius:30px}</style></head><body><main><a class="back" href="./">← 裕子さんのぽんこちゅ日記</a><header class="hero"><p class="date">2025年6月22日 · 港南台</p><h1>ありし日の<br>急なクルクル寿司</h1><p>突然始まる、裕子さんの回転寿司劇場。</p></header><div class="photos"><figure><a href="IMG_3531.jpeg"><img src="IMG_3531.jpeg" alt="回転寿司店でタブレットを持つ裕子さん" loading="eager"></a><figcaption>まずはメニューと真剣に向き合う。</figcaption></figure><figure><a href="IMG_3532.jpeg"><img src="IMG_3532.jpeg" alt="回転寿司店のタブレットを操作する裕子さん" loading="lazy"></a><figcaption>注文端末を前に、すっかり本気モード。</figcaption></figure></div><section class="story"><p>裕子さんは、もちろん家事が下手くそなだけではない。</p><p>2025年6月22日、港南台のクルクル寿司に突然出没！</p><p>家では台所との相性がいまひとつでも、お寿司屋さんでは注文用タブレットを手に、なんだか頼もしい。画面をじーっと見つめ、あれにしようか、これにしようか。お寿司を選ぶときの真剣さは、もはや職人級。</p><p>握るのは職人さん。注文するのは裕子さん。食べるのは、もちろんみんな。</p><p>今日も平和な、裕子さんのぽんこちゅ日記なのでした。</p></section><p style="text-align:center;margin-top:35px"><a class="back" href="./">← 日記に戻る</a></p></main></body></html>
