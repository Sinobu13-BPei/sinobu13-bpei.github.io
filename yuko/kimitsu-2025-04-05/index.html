<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裕子さんとお母さん、叔母さまに会いに君津へ｜裕子さんのぽんこちゅ日記</title><style>body{margin:0;background:#fcf8f1;color:#392f28;font-family:"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.85}main{max-width:1000px;margin:auto;padding:30px 20px 90px}header{text-align:center;padding:48px 0}h1{font-size:clamp(1.8rem,5vw,3.3rem);line-height:1.45}.date{color:#977557;letter-spacing:.12em}.lead{max-width:690px;margin:25px auto}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}.gallery figure{margin:0;background:white;border-radius:20px;overflow:hidden;box-shadow:0 5px 25px #46301c18}.gallery img{display:block;width:100%;height:auto}.gallery figcaption{padding:15px}.story{margin:35px auto;padding:30px;background:#fff0dc;border-radius:22px;max-width:760px}a{color:#79523c}.back{display:inline-block;padding:8px 18px;border:1px solid #c9ad92;border-radius:25px;text-decoration:none}</style></head><body><main><a class="back" href="../">← 裕子さんのぽんこちゅ日記</a><header><p class="date">2025.04.05 · 千葉県君津市</p><h1>裕子さんとお母さん、<br>叔母さまに会いに千葉へ</h1><p class="lead">2025年4月5日、叔母さまに会いに千葉県君津市へ。裕子さんとお母さんが並んでいただく、のんびりしたお昼ごはんのひととき。</p></header><section class="gallery"><figure><a href="IMG_2745.jpeg"><img src="IMG_2745.jpeg" alt="君津市で食事を楽しむ裕子さんとお母さん" loading="eager"></a><figcaption>裕子さんとお母さん、並んでお昼ごはん。</figcaption></figure><figure><a href="IMG_2746.jpeg"><img src="IMG_2746.jpeg" alt="食事を楽しむ裕子さんとお母さん、別カット" loading="lazy"></a><figcaption>揚げ物の定食を前に、会話も弾むひととき。</figcaption></figure></section><section class="story"><h2>君津での家族の一日</h2><p>叔母さまに会いに、裕子さんとお母さんと千葉へ。君津市でのお昼は、揚げ物の定食を囲んでほっと一息。</p><p>裕子さんはお箸を片手に、今日も食べる準備は万全。お母さんと並んだ何気ない二枚が、家族で過ごした一日の大切な記録になりました。</p><p>叔母さまとの再会を訪ねた、春の君津の思い出。</p></section><p style="text-align:center"><a class="back" href="../">日記トップに戻る</a></p></main></body></html>
