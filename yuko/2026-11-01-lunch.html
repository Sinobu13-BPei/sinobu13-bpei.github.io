<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裕子ちゃんとお昼ご飯。さて、どこへ行こう？｜裕子さんのぽんこちゅ日記</title><meta name="description" content="裕子ちゃんとお昼ご飯に出かける予定。行き先はまだ決まっていない。"><meta property="og:title" content="裕子ちゃんとお昼ご飯。さて、どこへ行こう？"><meta property="og:description" content="裕子ちゃんとお昼ご飯に出かける予定。行き先はまだ決まっていない。"><meta property="og:type" content="article"><style>*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;background:#fff9f3;color:#443d39;font:16.5px/1.85 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}header{background:#fff0df;padding:34px 16px;text-align:center}main{max-width:720px;margin:auto;padding:22px 16px 60px}h1{font-size:clamp(25px,6vw,36px);line-height:1.5;margin:8px 0}p{margin:0 0 1.4em}article,.note{background:white;border:1px solid #eddfce;border-radius:18px;padding:22px 18px;margin:20px 0}.meta{font-size:14px;color:#79675c}a{color:#92571e;display:inline-flex;align-items:center;min-height:44px}nav{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}.note{background:#fff0d8;font-weight:600}@media(prefers-color-scheme:dark){body{background:#211d1b;color:#f2e8df}header{background:#352a22}article{background:#2d2723;border-color:#58483d}.note{background:#453624;border-color:#685037}.meta{color:#d1b9a9}a{color:#ffcb91}}</style></head><body><header><div>裕子さんのぽんこちゅ日記</div><h1>裕子ちゃんとお昼ご飯。さて、どこへ行こう？</h1><div class="meta">2026年11月1日（日）｜高橋家の日常</div></header><main><article><p>11月1日、日曜日。今日は裕子ちゃんと、お昼ご飯を食べに行く予定。</p><p>ただし、肝心のお店は……まだ決まっていない！</p><p>何を食べようか、どこに行こうか。お店選びから始まる、ふたりの日曜日。</p><p>昨日は首が痛いと言っていた裕子ちゃん。無理のないお出かけになりますように。</p><p>お店が決まって、実際に食べに行ったら、続きはまたこの日記に。</p><div class="note">本日のひとこと：お昼の行き先、ただいま作戦会議中。</div></article><nav><a href="2026-10-31-neck.html">← 前の日記</a></nav><p><a href="./">← 日記の表紙へ戻る</a></p></main></body></html>
