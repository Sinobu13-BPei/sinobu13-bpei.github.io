<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2024年12月5日 仙台旅行｜裕子さんのぽんこちゅ日記</title><meta name="description" content="裕子さんと公泰くんの仙台旅行。雪の松島と、名古屋時代の友人との再会。"><style>*{box-sizing:border-box}body{margin:0;background:#f8fafb;color:#27343c;font-family:Meiryo,'Hiragino Kaku Gothic ProN',sans-serif;line-height:1.85}header{padding:65px 18px;text-align:center;color:white;background:linear-gradient(135deg,#29465a,#738c9d)}header small{letter-spacing:.18em}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.4}main{max-width:1100px;margin:auto;padding:28px 18px 70px}.lead{max-width:820px;background:white;margin:10px auto 35px;padding:clamp(18px,5vw,34px);border-radius:20px;box-shadow:0 5px 24px #22334412}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}figure{margin:0;background:white;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #22334412}figure:first-child{grid-column:1/-1}img{width:100%;display:block;max-height:720px;object-fit:contain;background:#e9eff1}figcaption{padding:12px 18px;color:#52616b}.back{display:inline-block;margin-top:36px;color:#2a576f}.note{background:#fff3df;padding:15px;border-radius:12px}@media(max-width:600px){.gallery{grid-template-columns:1fr}figure:first-child{grid-column:auto}} </style></head><body><header><small>YUKO'S FAMILY DIARY · SENDAI</small><p>2024年12月5日</p><h1>裕子さんと公泰くん<br>雪の仙台旅行</h1><p>松島の雪景色と、名古屋時代の友人との再会</p></header><main><article class="lead"><h2>雪の仙台へ、ふたり旅</h2><p>裕子さんと公泰くん、ふたりで仙台へ。雪が舞う街を歩き、松島では赤い欄干の橋を渡りました。髪やコートに雪が積もるほどの降り方も、この旅ならではの思い出です。</p><p>今回の旅では、名古屋時代の友人にも会いに行きました。旅先での再会を記念して、みんなで写真を一枚。雪景色も、懐かしい人との時間も残った12月の旅でした。</p></article><h2>旅の写真・5枚</h2><div class="gallery"><figure><img src="IMG_1972(1).jpeg" alt="雪の降る街で、公泰くん" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.textContent='写真の公開準備中：IMG_1972(1).jpeg'"><figcaption>雪の降る街で、公泰くん</figcaption></figure><figure><img src="IMG_1970(1).jpeg" alt="雪の松島、赤い橋の上の裕子さん" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.textContent='写真の公開準備中：IMG_1970(1).jpeg'"><figcaption>雪の松島、赤い橋の上の裕子さん</figcaption></figure><figure><img src="IMG_1968(1).jpeg" alt="雪の松島、橋の上の公泰くん" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.textContent='写真の公開準備中：IMG_1968(1).jpeg'"><figcaption>雪の松島、橋の上の公泰くん</figcaption></figure><figure><img src="IMG_1945(1).jpeg" alt="旅先で友人と記念撮影" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.textContent='写真の公開準備中：IMG_1945(1).jpeg'"><figcaption>旅先で友人と記念撮影</figcaption></figure><figure><img src="IMG_1944(1).jpeg" alt="旅先で友人と記念撮影" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.textContent='写真の公開準備中：IMG_1944(1).jpeg'"><figcaption>旅先で友人と記念撮影</figcaption></figure></div><p><a class="back" href="./">← 裕子さんの日記の表紙へ</a></p></main></body></html>
