<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#12305a"><title>全国医療市場アトラス｜認証画面</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Meiryo",sans-serif;background:linear-gradient(145deg,#12305a,#125c73);color:#162c43}.panel{width:min(100%,430px);background:#fff;border-radius:22px;padding:32px 25px;box-shadow:0 20px 55px #001e3540}h1{font-size:23px;margin:0 0 8px;line-height:1.45}p{color:#526479;line-height:1.7;font-size:14px}label{display:block;font-size:13px;font-weight:700;margin:20px 0 7px}input{width:100%;height:50px;border:2px solid #b7c9d6;border-radius:12px;padding:0 14px;font-size:18px}input:focus{outline:2px solid #0a8c91;border-color:#0a8c91}button{margin-top:15px;width:100%;min-height:50px;border:none;border-radius:12px;background:#087b84;color:#fff;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.65}.error{color:#a92628;min-height:20px;font-size:13px}.small{font-size:12px;color:#637388}</style></head><body><main class="panel"><h1>全国医療市場アトラス</h1><p>地域カルテ v230 を表示するには閲覧用パスワードを入力してください。</p><form id="gate"><label for="pw">閲覧パスワード</label><input type="password" id="pw" required autocomplete="current-password" autofocus><button id="go" type="submit">アトラスを開く</button><p class="error" id="error" role="alert"></p></form><p class="small">暗号化データはパスワード入力後、端末内で復号されます。GitHub Pagesの利用者認証・アクセス制御とは異なります。</p></main><script type="text/plain" id="data"></script><script>const salt=Uint8Array.from(atob('zNpHtg8yjuV/5k3L5nsxkg=='),c=>c.charCodeAt(0));const iv=Uint8Array.from(atob('Krhf1J+CAok4rqRf'),c=>c.charCodeAt(0));document.getElementById('gate').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('error');btn.disabled=true;btn.textContent='読み込み中…';err.textContent='';try{if(!crypto?.subtle)throw Error('HTTPS環境で開いてください');const pw=document.getElementById('pw').value;const raw=new TextEncoder().encode(pw);const keyBase=await crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:650000,hash:'SHA-256'},keyBase,{name:'AES-GCM',length:256},false,['decrypt']);const names=["part-00.txt","part-01.txt","part-02.txt","part-03.txt","part-04.txt","part-05.txt","part-06.txt","part-07.txt","part-08.txt","part-09.txt","part-10.txt","part-11.txt","part-12.txt","part-13a.txt","part-13b.txt","part-14.txt","part-15.txt"];const pieces=await Promise.all(names.map(async name=>{const response=await fetch('./'+name,{cache:'no-store'});if(!response.ok)throw Error('暗号化データの取得失敗 '+name);return response.text()}));const binary=atob(pieces.join(''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,bytes);const documentText=new TextDecoder().decode(plain);document.open();document.write(documentText);document.close()}catch(ex){err.textContent=ex.name==='OperationError'?'パスワードが違います。':('読み込みに失敗しました: '+ex.message)}finally{btn.disabled=false;btn.textContent='アトラスを開く'}});</script></body></html>
