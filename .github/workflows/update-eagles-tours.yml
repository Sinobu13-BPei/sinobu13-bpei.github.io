name: Weekly Eagles standings verification
on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday 09:00 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python eagles-tours/scripts/update_season.py
      - name: Commit verified update information
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eagles-tours/data/season.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: verify Eagles official standings (weekly)"
            git push
          fi
