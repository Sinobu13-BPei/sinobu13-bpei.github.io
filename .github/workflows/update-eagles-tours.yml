name: Eagles results - Sunday night and Monday follow-up
on:
  schedule:
    - cron: '50 14 * * 0' # Sunday 23:50 JST
    - cron: '30 15 * * 0' # Monday 00:30 JST
    - cron: '0 0 * * 1'   # Monday 09:00 JST (fallback)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: eagles-season-check
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Check official completed match results and standings
        run: python eagles-tours/scripts/update_season.py
      - name: Commit changes to published scoreboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eagles-tours/data/season.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Eagles scores and standings from official sites"
            git pull --rebase
            git push
          fi
