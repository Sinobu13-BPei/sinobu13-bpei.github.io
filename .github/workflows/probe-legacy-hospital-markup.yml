name: Inspect legacy hospital page markup and remaining homepage evidence
on:
  push:
    branches: [rev12-legacy-links-and-4921-triage-20261122]
    paths: ['.github/workflows/probe-legacy-hospital-markup.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install data dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'rapidfuzz>=3.0,<4'
      - name: Examine source record DOM, script placement and non-public URL formats
        run: |
          python - <<'PY'
          import sys,re,csv
          from pathlib import Path
          from collections import Counter
          import pandas as pd
          sys.path.insert(0,'medical-intelligence/hospitals/facility-master')
          from match_navi_20260601 import fetch_zip
          from build_official_websites import normalize_url
          h=Path('medical-intelligence/hospitals/index.html').read_text(encoding='utf-8')
          tr=re.findall(r'<tr\b(?=[^>]*\bdata-text=)[^>]*>[\s\S]*?</tr>',h,re.I)
          cells=re.findall(r'<td\b[^>]*>([\s\S]*?)</td>',tr[0],re.I)
          print('PROBE_ROW_COUNT',len(tr),'FIRST_CELL_COUNT',len(cells))
          print('PROBE_FIRST_ROW',tr[0][:2100])
          print('PROBE_SECOND_ROW',tr[1][:800])
          print('PROBE_EXISTING_NAME_LINKS',sum(bool(re.search(r'<a\b',re.findall(r'<td\b[^>]*>([\s\S]*?)</td>',x,re.I)[2],re.I)) for x in tr))
          print('PROBE_SCRIPT_SRCS',re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)',h,re.I)[-18:])
          print('PROBE_HTML_TAIL',h[-3000:])
          df,sha=fetch_zip()
          c='案内用ホームページアドレス'
          invalid=df[df[c].astype(str).map(lambda x:normalize_url(x)[1]=='invalid_scheme')]
          print('PROBE_INVALID_SCHEME_COUNT',len(invalid))
          print('PROBE_INVALID_SCHEME_SAMPLES',repr(list(invalid[['正式名称',c]].itertuples(index=False,name=None))[:24]))
          b=Path('medical-intelligence/hospitals/facility-master/data')
          matched=pd.read_csv(b/'identity-navi-20260601.csv',dtype=str,keep_default_na=False,encoding='utf-8-sig')
          links=pd.read_csv(b/'official-websites-navi-20260601.csv',dtype=str,keep_default_na=False,encoding='utf-8-sig')
          remaining=matched[~matched.facility_uid.isin(links.facility_uid)].copy()
          print('PROBE_REMAINING',len(remaining),'STATUSES',remaining.match_status.value_counts().to_dict(),'METHODS',remaining.match_method.value_counts().to_dict())
          idmap=df.set_index('ID',verify_integrity=True)[c].to_dict()
          pending=remaining[remaining.match_status=='要確認']
          pendingWithURL=pending.navi_facility_id_candidate.map(lambda i:normalize_url(idmap.get(i,''))[0]!='').fillna(False)
          print('PROBE_REVIEW_WITH_SAFE_CANDIDATE_URL',int(pendingWithURL.sum()),'TOTAL_PENDING',len(pending))
          PY
