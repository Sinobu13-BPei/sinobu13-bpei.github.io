name: Clinic Market Browser QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'clinic-medical-device-market/index.html'
      - 'clinic-medical-device-market/jm-legacy-1.css'
      - 'clinic-medical-device-market/qa-clinic-browser.mjs'
      - 'medical-intelligence/assets/site.css'
      - 'medical-intelligence/assets/site.js'
      - '.github/workflows/clinic-market-ui-qa.yml'
permissions:
  contents: read
jobs:
  clinic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify clinic market contrast and interactive controls in Chromium
        run: node clinic-medical-device-market/qa-clinic-browser.mjs
