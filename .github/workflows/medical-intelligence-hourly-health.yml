name: Medical Intelligence Hourly Health Check
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'medical-intelligence/hospitals/facility-master/**'
      - '.github/workflows/medical-intelligence-hourly-health.yml'
  push:
    branches: [main]
    paths:
      - 'medical-intelligence/hospitals/facility-master/**'
      - '.github/workflows/medical-intelligence-hourly-health.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install medical identity audit dependencies
        run: python -m pip install 'pandas>=2.2,<3' 'rapidfuzz>=3.0,<4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit-test full published file comparisons (no external network)
        run: python -m unittest discover -s medical-intelligence/hospitals/facility-master -p 'test_hourly_monitor.py' -v
      - name: Validate facility master UI including Chrome at desktop and mobile widths
        run: node medical-intelligence/hospitals/facility-master/qa-ui.mjs --browser
      - name: Check original 8019 hospitals and JavaScript syntax
        run: node medical-intelligence/hospitals/qa-hospitals-rev6.mjs
      - name: Check facility identity baseline against source
        run: python medical-intelligence/hospitals/facility-master/build_master.py --check --report reports/master-qa.json
      - name: Audit Navi crosswalk integrity without modifying matches
        run: python medical-intelligence/hospitals/facility-master/audit_identity.py --check-only --out-dir reports
      - name: Validate source-linked hospital website overlay (non-mutating)
        run: python medical-intelligence/hospitals/facility-master/validate_official_websites.py
      - name: Verify protected original hospital source unchanged except two asset refs
        run: python medical-intelligence/hospitals/facility-master/inject_legacy_website_overlay.py --check
      - name: Validate 3,098 legacy links and 4,921 unlinked review entries
        run: python medical-intelligence/hospitals/facility-master/validate_remaining_website_review.py
      - name: Verify separately reviewed hospital websites, 17 links and documented rename
        run: python medical-intelligence/hospitals/facility-master/validate_independently_reviewed_websites.py
      - name: Validate append-only Rev14 official website batch
        run: python medical-intelligence/hospitals/facility-master/validate_independently_reviewed_websites_rev14.py
      - name: Check local files and counts
        run: python medical-intelligence/hospitals/facility-master/hourly_monitor.py --report reports/hourly-local.json
      - name: Cross-check published baseline on data-preserving PRs
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main --depth=1
          # Compare EVERY SHA-pinned public payload path, not only the data CSV.
          # A PR that modifies HTML, JS or CSS must not compare an undeployed
          # candidate with the currently deployed previous version.
          if git diff --quiet origin/main HEAD -- \
            medical-intelligence/hospitals/index.html \
            medical-intelligence/hospitals/assets/legacy-official-websites-rev12.js \
            medical-intelligence/hospitals/assets/legacy-official-websites-rev12.css \
            medical-intelligence/hospitals/facility-master/index.html \
            medical-intelligence/hospitals/facility-master/identity-ui.js \
            medical-intelligence/hospitals/facility-master/official-website-links.js \
            medical-intelligence/hospitals/facility-master/independently-reviewed-websites.js \
            medical-intelligence/hospitals/facility-master/official-websites.css \
            medical-intelligence/hospitals/facility-master/data/; then
            echo "Monitored HTML/JS/CSS/data unaffected by PR; verify published bytes and SHA-256."
            python medical-intelligence/hospitals/facility-master/hourly_monitor.py --public --report reports/hourly-public-pr.json
          else
            echo "PR changes published data; defer live baseline comparison until deployment."
          fi
      - name: Check actual public URLs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python medical-intelligence/hospitals/facility-master/hourly_monitor.py --public --report reports/hourly-public.json
      - name: Upload per-run QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medical-intelligence-hourly-health
          path: reports/*.json
          retention-days: 30
          if-no-files-found: warn
