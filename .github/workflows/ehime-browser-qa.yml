
name: Ehime MKT Browser QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'medical-intelligence/ehime/**'
      - '.github/workflows/ehime-browser-qa.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Ehime data, sources, syntax and static fallbacks
        run: node medical-intelligence/ehime/qa-ehime.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Desktop and smartphone rendering / interaction tests
        run: node medical-intelligence/ehime/qa-browser.mjs
      - name: Save QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ehime-ui-screenshots
          path: medical-intelligence/ehime/qa-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
