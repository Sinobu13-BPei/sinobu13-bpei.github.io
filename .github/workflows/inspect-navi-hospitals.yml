name: Inspect official Navi hospital schema
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-navi-hospitals.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official 2026-06-01 hospital facilities and inspect headers
        env:
          OFFICIAL_URL: https://www.mhlw.go.jp/content/11121000/01-1_hospital_facility_info_20260601.csv.zip
        run: |
          python - <<'PY'
          import csv,hashlib,io,json,os,urllib.request,zipfile
          url=os.environ['OFFICIAL_URL']
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (research; medical-facility-open-data validation)'})
          with urllib.request.urlopen(req,timeout=65) as r:
              print('HTTP',r.status,'FINAL_URL',r.url,'MIME',r.headers.get('content-type'))
              content=r.read()
          print('ZIP_BYTES',len(content),'SHA256',hashlib.sha256(content).hexdigest())
          if not zipfile.is_zipfile(io.BytesIO(content)):raise RuntimeError('Official download was not a ZIP')
          with zipfile.ZipFile(io.BytesIO(content)) as z:
              for entry in z.infolist():
                  print('ENTRY',entry.filename,'UNCOMPRESSED',entry.file_size)
                  if not entry.filename.lower().endswith('.csv'):continue
                  with z.open(entry) as f:
                      wrapper=io.TextIOWrapper(f,encoding='utf-8-sig',newline='')
                      reader=csv.reader(wrapper)
                      header=next(reader)
                      print('CSV_COLUMN_COUNT',len(header))
                      print('CSV_HEADERS_JSON',json.dumps(header,ensure_ascii=False))
                      for i,row in enumerate(reader):
                          if i>=2:break
                          print('CSV_SAMPLE',i,json.dumps(dict(zip(header,row)),ensure_ascii=False)[:4200])
          PY
