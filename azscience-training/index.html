<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AZ SCIENCE × Canon Medical｜MKT・マーケティング研修</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#06111f;color:#fff}
#shell{height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 25% 15%,#16487e 0,#091a30 42%,#02070e 100%)}
.card{width:min(620px,94vw);background:rgba(255,255,255,.97);color:#102844;border-radius:28px;padding:34px;box-shadow:0 30px 110px #0009;text-align:center}.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#e8f4ff;color:#0b66b7;font-weight:800}h1{font-size:clamp(28px,5vw,46px);margin:14px 0 5px}.sub{color:#65758a;line-height:1.65;margin:0 0 22px}.deadline{display:inline-flex;gap:8px;align-items:center;background:#fff2f1;color:#a92222;border:1px solid #ffd2cf;border-radius:12px;padding:9px 12px;margin:0 0 18px;font-weight:800}.row{display:flex;gap:10px}input{flex:1;min-width:0;padding:15px 16px;border:2px solid #cbd9e8;border-radius:14px;font-size:20px;outline:none}input:focus{border-color:#1673c9}button{border:0;border-radius:14px;padding:0 24px;background:linear-gradient(135deg,#0b2f5b,#0d73c9);color:white;font-size:17px;font-weight:800;cursor:pointer}.err{min-height:24px;color:#c81d25;font-weight:800;margin-top:11px}.note{font-size:12px;color:#7f8c9e;line-height:1.55}#loading{display:none}.spinner{width:42px;height:42px;margin:16px auto;border:4px solid #dbe8f4;border-top-color:#0d73c9;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#viewer{position:fixed;inset:0;display:none;background:#000}#viewer iframe{width:100%;height:100%;border:0;background:#000}.expired h1{color:#a92222}@media(max-width:600px){.card{padding:26px 20px}.row{flex-direction:column}button{padding:14px 18px}}
</style></head><body>
<div id="shell"><div class="card" id="login"><div class="badge">AZ SCIENCE × Canon Medical</div><h1>Presentation Access</h1><p class="sub">アズサイエンス様 11月11日<br>MKT・マーケティング研修資料</p><div class="deadline">公開期限：2026年11月30日 23:59（日本時間）</div><form id="form" class="row"><input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" aria-label="パスワード"><button>開く</button></form><div class="err" id="err"></div><p class="note">関係者向け資料です。期限終了後は閲覧できません。</p></div><div class="card" id="loading"><div class="badge">Loading</div><h1>資料を準備しています</h1><div class="spinner"></div><p class="sub" id="loadmsg">暗号化された資料を読み込んでいます…</p></div></div>
<div id="viewer"><iframe id="frame" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-modals"></iframe></div>
<script>
const DEADLINE=Date.parse('2026-11-30T23:59:59+09:00');
const PARTS=["payload-01.txt","payload-02.txt","payload-03.txt","payload-04.txt","payload-05.txt","payload-06.txt","payload-07.txt","payload-08.txt","payload-09.txt","payload-10.txt"];
const SALT='2dj0aJiaalMjFqc4fPs6jw==',IV='9mZ8m+fYiGO59HAP',ITER=240000,AAD='AZSCIENCE-202611';
let serverOffset=0;const $=s=>document.querySelector(s);
function b64bytes(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function syncServerTime(){try{const r=await fetch(location.pathname+'?time='+Date.now(),{method:'HEAD',cache:'no-store'});const d=r.headers.get('date');if(d)serverOffset=Date.parse(d)-Date.now()}catch(e){}}
function now(){return Date.now()+serverOffset}
function showExpired(){$('#viewer').style.display='none';$('#shell').style.display='grid';$('#shell').innerHTML='<div class="card expired"><div class="badge">Publication Ended</div><h1>公開期間は終了しました</h1><p class="sub">本資料の公開期限は<br><strong>2026年11月30日</strong>でした。</p><p class="note">関係者向け期間限定公開</p></div>'}
async function derive(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])}
async function loadPresentation(pw){if(now()>DEADLINE){showExpired();return}$('#login').style.display='none';$('#loading').style.display='block';try{const arr=[];for(let i=0;i<PARTS.length;i++){const r=await fetch(PARTS[i],{cache:'force-cache'});if(!r.ok)throw new Error('load '+PARTS[i]);arr.push(await r.text());$('#loadmsg').textContent='資料を読み込み中 '+(i+1)+' / '+PARTS.length}const enc=b64bytes(arr.join(''));const key=await derive(pw);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(IV),additionalData:new TextEncoder().encode(AAD)},key,enc);if(!('DecompressionStream' in window))throw new Error('unsupported');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([plain]).stream().pipeThrough(ds)).text();sessionStorage.setItem('azscience-auth','1');$('#shell').style.display='none';$('#viewer').style.display='block';$('#frame').srcdoc=html;setInterval(()=>{if(now()>DEADLINE)showExpired()},60000)}catch(e){console.error(e);$('#loading').style.display='none';$('#login').style.display='block';$('#err').textContent='パスワードが違うか、資料の読み込みに失敗しました。';$('#pw').select()}}
(async()=>{await syncServerTime();if(now()>DEADLINE){showExpired();return}$('#pw').focus();setInterval(syncServerTime,300000)})();
$('#form').addEventListener('submit',e=>{e.preventDefault();$('#err').textContent='';loadPresentation($('#pw').value)});
</script></body></html>
