<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>AZ SCIENCE × Canon Medical | MKT・マーケティング研修</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif;background:#06101e;color:#fff}
main{height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 30% 20%,#164779 0,#081522 52%,#02060d 100%)}
.card{width:min(580px,92vw);padding:36px 34px;border-radius:28px;background:rgba(255,255,255,.97);color:#0c2342;box-shadow:0 30px 100px rgba(0,0,0,.5);text-align:center}
.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#e9f4ff;color:#0b5eae;font-weight:800;margin-bottom:16px}
h1{font-size:clamp(28px,5vw,44px);margin:6px 0 10px}p{color:#66758a;line-height:1.65}.deadline{display:inline-block;margin:7px 0 2px;padding:9px 13px;border-radius:12px;background:#fff0ef;border:1px solid #ffd0cc;color:#a72525;font-weight:800}
.row{display:flex;gap:10px;margin-top:20px}.row input{flex:1;min-width:0;padding:15px 16px;border:2px solid #cbd9e8;border-radius:14px;font-size:20px;outline:none}.row input:focus{border-color:#1673c9}
.row button{border:0;border-radius:14px;padding:0 22px;background:linear-gradient(135deg,#0b2f5b,#0d73c9);color:#fff;font-size:17px;font-weight:800;cursor:pointer}.row button:disabled{opacity:.55;cursor:wait}
#msg{min-height:26px;margin-top:12px;color:#c81d25;font-weight:800}.progress{height:8px;background:#e6edf5;border-radius:999px;overflow:hidden;margin-top:18px;display:none}
.bar{height:100%;width:0;background:linear-gradient(90deg,#12a6d7,#0c5fb5,#c81d25);transition:.15s}.note{font-size:12px;color:#8793a2;margin-top:12px}.expired h1{color:#a72525}
@media(max-width:600px){.card{padding:28px 20px}.row{flex-direction:column}.row button{padding:14px 18px}}
</style></head><body><main id="main"><section class="card" id="card"><div class="badge">AZ SCIENCE × Canon Medical</div><h1>Presentation Access</h1>
<p>アズサイエンス様 11月11日<br>MKT・マーケティング研修資料</p>
<div class="deadline">公開期限：2026年11月30日 23:59（日本時間）</div>
<form id="f" class="row"><input id="pw" type="password" autocomplete="current-password" placeholder="パスワード"><button id="openBtn" disabled>開く</button></form>
<div id="msg">公開期限を確認しています…</div><div id="prog" class="progress"><div id="bar" class="bar"></div></div><div class="note">関係者向け・期間限定公開です。</div></section></main>
<script>
const EXPECT="292f1ec3ba280262685e0c11078e2f1a2be2f7929c5cbca8ab9a6008822d7124";
const DEADLINE=Date.parse("2026-11-30T23:59:59+09:00");
const PARTS=["parts/part-001.txt","parts/part-002.txt","parts/part-003.txt","parts/part-004.txt","parts/part-005.txt","parts/part-006.txt","parts/part-007.txt","parts/part-008.txt","parts/part-009.txt","parts/part-010.txt","parts/part-011.txt","parts/part-012.txt","parts/part-013.txt","parts/part-014.txt","parts/part-015.txt","parts/part-016.txt","parts/part-017.txt","parts/part-018.txt"];
let serverOffset=0, timeReady=false;
async function syncServerTime(){try{const r=await fetch(location.pathname+"?clock="+Date.now(),{method:"HEAD",cache:"no-store"});const d=r.headers.get("date");if(d)serverOffset=Date.parse(d)-Date.now()}catch(e){}timeReady=true}
function now(){return Date.now()+serverOffset}
function expired(){return now()>DEADLINE}
function showExpired(){document.getElementById("main").innerHTML='<section class="card expired"><div class="badge">Publication Ended</div><h1>公開期間は終了しました</h1><p>本資料の公開期限は<br><strong>2026年11月30日</strong>でした。</p><div class="deadline">現在は閲覧できません</div><div class="note">AZ SCIENCE × Canon Medical</div></section>'}
async function digest(t){const b=new TextEncoder().encode(t),d=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function b64ToUtf8(s){const bin=atob(s),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return new TextDecoder("utf-8").decode(bytes)}
async function loadDeck(){if(expired()){showExpired();return}const m=document.getElementById("msg"),p=document.getElementById("prog"),bar=document.getElementById("bar");p.style.display="block";m.style.color="#1766a8";m.textContent="資料を読み込んでいます…";let all="";for(let i=0;i<PARTS.length;i++){if(expired()){showExpired();return}const r=await fetch(PARTS[i],{cache:"force-cache"});if(!r.ok)throw new Error(PARTS[i]);all+=await r.text();bar.style.width=((i+1)/PARTS.length*100)+"%"}let html=b64ToUtf8(all.replace(/\s+/g,""));const offset=serverOffset;const guard='<script>(function(){const D=Date.parse("2026-11-30T23:59:59+09:00"),O='+offset+';function x(){if(Date.now()+O>D){document.body.innerHTML="<div style=\\"height:100vh;display:grid;place-items:center;background:#06101e;color:white;font-family:sans-serif;text-align:center\\"><div><h1>公開期間は終了しました</h1><p>公開期限：2026年11月30日</p></div></div>";}}setInterval(x,60000);x();})();<\/script>';html=html.replace("<body>","<body>"+guard);sessionStorage.setItem("azscience-auth","1");document.open();document.write(html);document.close()}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const m=document.getElementById("msg");if(!timeReady){m.textContent="公開期限を確認中です。";return}if(expired()){showExpired();return}if(await digest(document.getElementById("pw").value)!==EXPECT){m.style.color="#c81d25";m.textContent="パスワードが違います";return}try{await loadDeck()}catch(err){m.style.color="#c81d25";m.textContent="読み込みに失敗しました。再読み込みしてください。";console.error(err)}});
(async()=>{await syncServerTime();if(expired()){showExpired();return}const b=document.getElementById("openBtn"),m=document.getElementById("msg");b.disabled=false;m.textContent="";document.getElementById("pw").focus();setInterval(async()=>{await syncServerTime();if(expired())showExpired()},300000)})();
</script></body></html>
